---
# 1. Base Setup and WireGuard Installation
- name: Prepare VPN Nodes and Install WireGuard
  hosts: aws_vpn, oci_node
  become: yes
  gather_facts: no
  tasks:
    - name: Wait for SSH
      wait_for_connection:
        delay: 5
        timeout: 300
    - name: Gather facts
      setup:
    - name: Install WireGuard
      apt:
        name: wireguard
        state: present
        update_cache: yes
    - name: Generate private key
      shell: wg genkey
      register: private_key
      changed_when: false
    - name: Generate public key
      shell: echo "{{ private_key.stdout }}" | wg pubkey
      register: public_key
      changed_when: false

# 2. Configure AWS Private Database & Insert Data
- name: Configure AWS Database Node
  hosts: aws_db
  become: yes
  gather_facts: no
  tasks:
    - name: Wait for SSH via Bastion
      wait_for_connection:
        delay: 5
        timeout: 300
    - name: Gather facts
      setup:
    - name: Install MySQL and dependencies
      apt:
        name: 
          - mysql-server
          - python3-pymysql
        state: present
        update_cache: yes
    - name: Configure MySQL to listen on all interfaces
      lineinfile:
        path: /etc/mysql/mysql.conf.d/mysqld.cnf
        regexp: '^bind-address'
        line: 'bind-address = 0.0.0.0'
      notify: Restart MySQL
    - name: Ensure MySQL is running
      service:
        name: mysql
        state: started
        enabled: yes
    - name: Create database
      community.mysql.mysql_db:
        name: lab_db
        state: present
        login_unix_socket: /var/run/mysqld/mysqld.sock
    - name: Create database user for OCI Web Node
      community.mysql.mysql_user:
        name: lab_user
        password: "SuperSecretPassword123!"
        priv: 'lab_db.*:ALL'
        host: '%'
        state: present
        login_unix_socket: /var/run/mysqld/mysqld.sock
    - name: Create table and insert data
      community.mysql.mysql_query:
        login_db: lab_db
        login_unix_socket: /var/run/mysqld/mysqld.sock
        query: 
          - "CREATE TABLE IF NOT EXISTS messages (id INT AUTO_INCREMENT PRIMARY KEY, text VARCHAR(255))"
          - "TRUNCATE TABLE messages"
          - "INSERT INTO messages (text) VALUES ('Hello from the AWS Private Database through the WireGuard Tunnel!')"
  handlers:
    - name: Restart MySQL
      service:
        name: mysql
        state: restarted

# 3. Configure Site-to-Site Tunnels
- name: Configure AWS VPN Tunnel
  hosts: aws_vpn
  become: yes
  tasks:
    - name: Create wg0 config on AWS
      copy:
        dest: /etc/wireguard/wg0.conf
        content: |
          [Interface]
          Address = 10.99.0.1/24
          PrivateKey = {{ private_key.stdout }}
          ListenPort = 51820
          PostUp = iptables -A FORWARD -i wg0 -j ACCEPT; iptables -t nat -A POSTROUTING -o ens5 -j MASQUERADE
          PostDown = iptables -D FORWARD -i wg0 -j ACCEPT; iptables -t nat -D POSTROUTING -o ens5 -j MASQUERADE

          [Peer]
          PublicKey = {{ hostvars[groups['oci_node'][0]]['public_key']['stdout'] }}
          Endpoint = 141.145.212.135:51820
          AllowedIPs = 10.99.0.2/32, 10.0.0.0/16
          PersistentKeepalive = 25
    - name: Start and enable WireGuard
      systemd:
        name: wg-quick@wg0
        enabled: yes
        state: restarted

- name: Configure OCI VPN Tunnel & Web Service
  hosts: oci_node
  become: yes
  tasks:
    - name: Create wg0 config on OCI
      copy:
        dest: /etc/wireguard/wg0.conf
        content: |
          [Interface]
          Address = 10.99.0.2/24
          PrivateKey = {{ private_key.stdout }}
          ListenPort = 51820

          [Peer]
          PublicKey = {{ hostvars[groups['aws_vpn'][0]]['public_key']['stdout'] }}
          Endpoint = 13.61.252.157:51820
          AllowedIPs = 10.99.0.1/32, 10.1.0.0/16
          PersistentKeepalive = 25
    - name: Start and enable WireGuard
      systemd:
        name: wg-quick@wg0
        enabled: yes
        state: restarted
    - name: Install Apache and PHP
      apt:
        name:
          - apache2
          - php
          - php-mysql
        state: present
    - name: Create Web Application
      copy:
        dest: /var/www/html/index.php
        content: |
          <!DOCTYPE html>
          <html>
          <head>
              <title>OCI Web Server</title>
              <style>body { font-family: Arial, sans-serif; margin: 40px; line-height: 1.6; }</style>
          </head>
          <body>
              <h1>🌐 Le Serveur Web fonctionne !</h1>
              <p>Cette page est servie depuis votre instance Oracle Cloud.</p>
              <hr>
              <h2>Statut de la Base de Données (via VPN) :</h2>
              <?php
              // Désactiver l'affichage des erreurs brutes pour gérer proprement
              mysqli_report(MYSQLI_REPORT_OFF);
              
              $mysqli = @new mysqli("10.1.2.50", "lab_user", "SuperSecretPassword123!", "lab_db");
              
              if ($mysqli->connect_error) {
                  echo "<p style='color: red;'><strong>❌ Échec de la connexion :</strong> " . htmlspecialchars($mysqli->connect_error) . "</p>";
                  echo "<p>Vérifiez que le tunnel WireGuard est monté et que le Security Group AWS autorise le port 3306.</p>";
              } else {
                  $result = $mysqli->query("SELECT text FROM messages LIMIT 1");
                  if ($result && $row = $result->fetch_assoc()) {
                      echo "<p style='color: green;'><strong>✅ Connexion réussie !</strong></p>";
                      echo "<p>Message extrait de la BDD AWS : <em>" . htmlspecialchars($row['text']) . "</em></p>";
                  } else {
                      echo "<p style='color: orange;'>✅ Connecté, mais aucune donnée trouvée dans la table.</p>";
                  }
                  $mysqli->close();
              }
              ?>
          </body>
          </html>
    - name: Remove default index.html
      file:
        path: /var/www/html/index.html
        state: absent
    - name: Open OS Firewall for HTTP (Port 80)
      iptables:
        chain: INPUT
        protocol: tcp
        destination_port: 80
        jump: ACCEPT
        action: insert
        rule_num: 1