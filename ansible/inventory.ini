[aws_node]
# Remplacez <IP_AWS> par l'adresse IP publique attribuée à l'instance t3.micro
<IP_AWS> ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/id_rsa

[oci_node]
# Remplacez <IP_OCI> par l'adresse IP publique attribuée à l'instance Oracle
<IP_OCI> ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/id_rsa